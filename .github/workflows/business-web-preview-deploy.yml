name: Phase 3C-1C isolated Preview E2E

# Reuses the historically registered workflow path. No push or PR trigger.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [e2e]
        default: e2e
        required: true
      expected_sha:
        description: Exact already-verified Phase 3 revision
        type: string
        required: true
      confirm_target:
        description: Must equal stampaix-pwa-phase3-e2e
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Serialize manual destructive recreation of this dedicated synthetic Preview only.
concurrency:
  group: phase3c1-stampaix-pwa-phase3-e2e
  cancel-in-progress: false

jobs:
  isolated-preview:
    if: github.repository == 'PetFamily2/STAMPIX_APP' && github.ref == 'refs/heads/pwa/phase-3-scanner-commands-20261005' && (github.actor == 'PetFamily2' || github.actor == 'github-actions[bot]') && inputs.mode == 'e2e' && inputs.confirm_target == 'stampaix-pwa-phase3-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require exact current branch and previously successful verify job
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const sha = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid expected revision');
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'pwa/phase-3-scanner-commands-20261005'
            });
            if (branch.commit.sha !== sha || context.sha !== sha) throw new Error('Stale revision');
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, head_sha: sha, event: 'pull_request', per_page: 20
            });
            let verified = false;
            for (const run of data.workflow_runs.filter(r => r.path === '.github/workflows/branch-verify.yml')) {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: run.id
              });
              if (jobs.jobs.some(j => j.name === 'verify' && j.conclusion === 'success')) verified = true;
            }
            if (!verified) throw new Error('No successful verify job for this exact revision');
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Setup EAS for Preview environment only
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Pull Preview environment privately
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull preview --path .env.preview-pulled --non-interactive > "${{ runner.temp }}/eas-env-pull.log" 2>&1
      - name: Create verified isolated Preview, seed synthetic actors and run live E2E
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          VERIFIED_HEAD_SHA: ${{ inputs.expected_sha }}
          PHASE3_PREVIEW_NAME: ${{ inputs.confirm_target }}
        run: bun scripts/phase3c1-preview-e2e.mjs
      - name: Export exact corresponding Preview client
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx expo export --platform web --max-workers 2 > "${{ runner.temp }}/phase3-web-export.log" 2>&1
          bun scripts/export-web-scanner-business.mjs dist
          node scripts/verify-client-secret-patterns.mjs dist
          node scripts/phase3-preview/verify-export.mjs dist
      - name: Deploy EAS Hosting Preview only after live E2E
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERIFIED_HEAD_SHA: ${{ inputs.expected_sha }}
        run: |
          eas deploy --environment preview --non-interactive --dev-domain stampaix-business --json > eas-deploy.json 2> "${{ runner.temp }}/phase3-eas-deploy.log"
          node scripts/phase3-preview/report-hosting.mjs
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c1-preview-evidence
          path: phase3c1-preview-evidence.json
          if-no-files-found: ignore
          retention-days: 7
