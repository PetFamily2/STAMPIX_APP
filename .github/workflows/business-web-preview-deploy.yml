name: Deploy Business Web Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    if: github.head_ref == 'launch/trial-and-launch-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is missing. Add an Expo access token with access to petfamily2/stampix."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy Business Web preview
        id: deploy
        run: |
          eas deploy --environment preview --non-interactive --json > eas-deploy.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('eas-deploy.json', 'utf8'));
          const candidates = [
            payload.url,
            payload.deploymentUrl,
            payload.previewUrl,
            payload?.deployment?.url,
            payload?.deployment?.previewUrl,
          ].filter(Boolean);
          const url = candidates.find((value) => typeof value === 'string' && value.startsWith('https://'));
          if (!url) {
            console.error('EAS deployment completed but preview URL was not found in JSON output.');
            console.error(JSON.stringify(payload, null, 2));
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          NODE

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          BUSINESS_WEB_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.BUSINESS_WEB_URL;
            const body = [
              '### Business Web Preview',
              '',
              `כניסה לעסקים: ${url}/business`,
              '',
              'הפריסה משתמשת בסביבת EAS Preview ואינה Production.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
