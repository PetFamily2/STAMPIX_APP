name: Deploy Business Web Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    if: github.head_ref == 'launch/trial-and-launch-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is missing. Add an Expo access token with access to petfamily2/stampix."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Load Preview environment
        run: eas env:pull preview --path .env.local --non-interactive

      - name: Resolve Convex DEV deployment
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = '.env.local';
          const source = fs.readFileSync(path, 'utf8');
          if (/^CONVEX_DEPLOYMENT=/m.test(source)) {
            process.exit(0);
          }

          const match = source.match(/^EXPO_PUBLIC_CONVEX_URL_DEV=(.*)$/m);
          if (!match) {
            console.error('EXPO_PUBLIC_CONVEX_URL_DEV is missing from EAS Preview environment.');
            process.exit(1);
          }

          const raw = match[1].trim().replace(/^["']|["']$/g, '');
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error('EXPO_PUBLIC_CONVEX_URL_DEV is not a valid URL.');
            process.exit(1);
          }

          const suffix = '.convex.cloud';
          if (
            url.protocol !== 'https:' ||
            !url.hostname.endsWith(suffix)
          ) {
            console.error('Preview Convex URL is not a canonical convex.cloud URL.');
            process.exit(1);
          }

          const slug = url.hostname.slice(0, -suffix.length);
          if (!/^[a-z0-9-]+$/.test(slug)) {
            console.error('Could not derive a safe Convex DEV deployment slug.');
            process.exit(1);
          }

          fs.appendFileSync(path, `\nCONVEX_DEPLOYMENT=dev:${slug}\n`);
          NODE

      - name: Require matching Convex DEV deploy key
        env:
          CONVEX_DEV_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEV_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEV_DEPLOY_KEY repository secret is missing."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const envFile = fs.readFileSync('.env.local', 'utf8');
          const deployment = envFile.match(/^CONVEX_DEPLOYMENT=(.*)$/m)?.[1]?.trim();
          const key = process.env.CONVEX_DEV_DEPLOY_KEY ?? '';
          if (!deployment?.startsWith('dev:')) {
            console.error('Resolved Convex target is not DEV.');
            process.exit(1);
          }
          const expectedPrefix = deployment + '|';
          if (!key.startsWith(expectedPrefix)) {
            console.error('CONVEX_DEV_DEPLOY_KEY does not match the resolved DEV deployment.');
            process.exit(1);
          }
          NODE

      - name: Sync Convex DEV backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
        run: bun run convex:dev:sync

      - name: Export Business Web
        run: EXPO_PUBLIC_APP_ENV=preview bunx expo export --platform web

      - name: Deploy Business Web preview
        id: deploy
        run: |
          eas deploy --environment preview --non-interactive --dev-domain stampaix-business --json > eas-deploy.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('eas-deploy.json', 'utf8'));
          const records = Array.isArray(payload) ? payload : [payload];
          const candidates = records.flatMap((record) => [
            record?.url,
            record?.deploymentUrl,
            record?.previewUrl,
            record?.deployment?.url,
            record?.deployment?.previewUrl,
            record?.metadata?.url,
          ]).filter(Boolean);
          const url = candidates.find(
            (value) => typeof value === 'string' && value.startsWith('https://')
          );
          if (!url) {
            console.error('EAS deployment completed but preview URL was not found in JSON output.');
            console.error(JSON.stringify(payload, null, 2));
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          NODE

      - name: Remove pulled environment file
        if: always()
        run: rm -f .env.local

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          BUSINESS_WEB_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.BUSINESS_WEB_URL;
            const body = [
              '### Business Web Preview',
              '',
              `כניסה לעסקים: ${url}/business`,
              '',
              'הפריסה משתמשת בסביבת EAS Preview ואינה Production.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
