name: Stage 2 offline verification

on:
  push:
    branches:
      - performance/stage2-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run type-check
      - name: Lint
        run: bun run lint
      - name: Focused Push and automation regression
        run: bun test convex/__tests__/pushNotifications.test.js convex/__tests__/campaignPushDelivery.test.js
      - name: Web Android iOS JavaScript export
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_WEB_ROLE_ROUTING: 'true'
          EXPO_PUBLIC_PWA_ENABLED: 'true'
        run: bunx expo export --platform all --output-dir ${{ runner.temp }}/stage2-js-export --max-workers 2
      - name: No whitespace errors
        run: git diff --check HEAD~1 HEAD
