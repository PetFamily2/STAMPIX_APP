name: Billing lifecycle verification

on:
  push:
    branches:
      - launch/sumit-lifecycle-hardening
      - launch/14-day-pro-trial
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      - name: Type check
        run: bun run type-check
      - name: RTL source contract
        run: bun run verify:rtl-build-source
      - name: Diff check
        run: git diff --check
