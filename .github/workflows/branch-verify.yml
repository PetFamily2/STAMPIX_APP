name: Verify and Web Preview

# One PR run per revision. Existing shared backend only; no fixture provisioning.
on:
  pull_request:
    branches:
      - main
      - launch/trial-and-launch-hardening
      - pwa/phase-1-role-routing-20261004
      - pwa/phase-2-qr-foundation-20261005
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verify-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revision-scope:
    runs-on: ubuntu-latest
    outputs:
      deployment_only: ${{ steps.scope.outputs.deployment_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: scope
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const base = '0e96776a2fd7dc0156c377d59f3d25c97de515d6';
          const allowed = new Set(['scripts/deploy-shared-web.mjs', '.github/workflows/branch-verify.yml', 'docs/SHARED_WEB.md']);
          let deploymentOnly = false;
          try {
            execFileSync('git', ['merge-base', '--is-ancestor', base, 'HEAD']);
            const paths = execFileSync('git', ['diff', '--name-only', base, 'HEAD'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
            deploymentOnly = paths.length > 0 && paths.every(path => allowed.has(path));
          } catch {}
          appendFileSync(process.env.GITHUB_OUTPUT, `deployment_only=${deploymentOnly}\n`);
          NODE
      - name: Retain exact successful application verification
        if: steps.scope.outputs.deployment_only == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: job } = await github.rest.actions.getJobForWorkflowRun({ ...context.repo, job_id: 114176935181 });
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 38039567529 });
            if (job.conclusion !== 'success' || job.run_id !== run.id || run.head_sha !== '0e96776a2fd7dc0156c377d59f3d25c97de515d6') throw new Error('Retained application verification not proven');
      - name: Check changed deployment script
        run: node --check scripts/deploy-shared-web.mjs

  verify:
    needs: revision-scope
    if: needs.revision-scope.outputs.deployment_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_CONVEX_URL_DEV: https://utmost-fennec-280.convex.cloud
      EXPO_PUBLIC_WEB_ROLE_ROUTING: 'false'
      EXPO_PUBLIC_WEB_QR_LAB: 'false'
      EXPO_PUBLIC_WEB_SCANNER_COMMANDS: 'true'
      EXPO_PUBLIC_STAMPAIX_SHARED_BACKEND: 'true'
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      - name: Type check
        run: bun run type-check
      - name: Manual RTL source and native config contracts
        run: |
          bun run verify:rtl-build-source
          bun run verify:rtl-native-config
      - name: Phase 1 boundaries and Native billing guard
        if: startsWith(github.head_ref, 'pwa/phase-1-')
        run: node scripts/verify-web-phase1-boundaries.mjs
      - name: Phase 2 isolated scanner and Native contracts
        if: startsWith(github.head_ref, 'pwa/phase-2-')
        run: node scripts/verify-web-phase2-boundaries.mjs
      - name: Scanner safety and protected camera/billing contracts
        if: startsWith(github.head_ref, 'pwa/phase-3-')
        run: node scripts/verify-web-phase3-boundaries.mjs
      - name: Export Web, iOS and Android JavaScript with rollout enabled
        env:
          EXPO_PUBLIC_WEB_ROLE_ROUTING: 'true'
          EXPO_PUBLIC_PWA_ENABLED: 'true'
          EXPO_PUBLIC_SCANNER_RECEIPTS: 'true'
        run: bunx expo export --platform all --output-dir ${{ runner.temp }}/phase1-verify-export --max-workers 2
      - name: Export isolated scanner lab in Preview only
        if: startsWith(github.head_ref, 'pwa/phase-2-')
        env:
          EXPO_PUBLIC_WEB_QR_LAB: 'true'
        run: bun scripts/export-qr-lab.mjs ${{ runner.temp }}/phase1-verify-export
      - name: Export Phase 3 Preview worker assets
        if: startsWith(github.head_ref, 'pwa/phase-3-')
        run: bun scripts/export-web-scanner-business.mjs ${{ runner.temp }}/phase1-verify-export
      - name: Verify install manifest and safe PWA artifacts
        if: startsWith(github.head_ref, 'pwa/phase-3-')
        run: node scripts/finalize-web-pwa-export.mjs ${{ runner.temp }}/phase1-verify-export
      - name: Exported client secret patterns
        run: node scripts/verify-client-secret-patterns.mjs ${{ runner.temp }}/phase1-verify-export
      - name: Diff check
        run: git diff --check

  # Full application deployment normally needs: verify; control fixes retain its exact successful job.
  shared-web:
    needs: [revision-scope, verify]
    if: always() && needs.revision-scope.result == 'success' && (needs.verify.result == 'success' || needs.revision-scope.outputs.deployment_only == 'true') && github.repository == 'PetFamily2/STAMPIX_APP' && github.head_ref == 'pwa/phase-3-scanner-commands-20261005' && github.event.pull_request.head.repo.full_name == github.repository && (github.actor == 'PetFamily2' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: stampaix-shared-existing-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reject superseded revision before using credentials
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'pwa/phase-3-scanner-commands-20261005' });
            if (branch.commit.sha !== process.env.EXPECTED_HEAD) throw new Error('Superseded revision');
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Sync existing backend and host the corresponding Web app
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHARED_CONVEX_DEV_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
          SHARED_CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          EXISTING_PROJECT_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: bun scripts/deploy-shared-web.mjs
      - name: Upload nonsecret results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-web-evidence
          path: shared-web-evidence.json
          if-no-files-found: error
          retention-days: 7
