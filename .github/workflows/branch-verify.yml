name: Verify and Web Preview

# One PR run per revision. Only the explicitly pinned Phase 3 source may provision synthetic Preview.
on:
  pull_request:
    branches:
      - main
      - launch/trial-and-launch-hardening
      - pwa/phase-1-role-routing-20261004
      - pwa/phase-2-qr-foundation-20261005
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verify-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_CONVEX_URL_DEV: https://phase1-build-only.convex.cloud
      EXPO_PUBLIC_WEB_ROLE_ROUTING: 'false'
      EXPO_PUBLIC_WEB_QR_LAB: 'false'
      EXPO_PUBLIC_WEB_SCANNER_COMMANDS: 'false'
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      - name: Type check
        run: bun run type-check
      - name: Manual RTL source and native config contracts
        run: |
          bun run verify:rtl-build-source
          bun run verify:rtl-native-config
      - name: Phase 1 boundaries and Native billing guard
        if: startsWith(github.head_ref, 'pwa/phase-1-')
        run: node scripts/verify-web-phase1-boundaries.mjs
      - name: Phase 2 isolated scanner and Native contracts
        if: startsWith(github.head_ref, 'pwa/phase-2-')
        run: node scripts/verify-web-phase2-boundaries.mjs
      - name: Scanner safety and protected camera/billing contracts
        if: startsWith(github.head_ref, 'pwa/phase-3-')
        run: node scripts/verify-web-phase3-boundaries.mjs
      - name: Export Web, iOS and Android JavaScript with rollout enabled
        env:
          EXPO_PUBLIC_WEB_ROLE_ROUTING: 'true'
          EXPO_PUBLIC_PWA_ENABLED: 'true'
          EXPO_PUBLIC_SCANNER_RECEIPTS: 'true'
        run: bunx expo export --platform all --output-dir ${{ runner.temp }}/phase1-verify-export --max-workers 2
      - name: Export isolated scanner lab in Preview only
        if: startsWith(github.head_ref, 'pwa/phase-2-')
        env:
          EXPO_PUBLIC_WEB_QR_LAB: 'true'
        run: bun scripts/export-qr-lab.mjs ${{ runner.temp }}/phase1-verify-export
      - name: Export Phase 3 Preview worker assets
        if: startsWith(github.head_ref, 'pwa/phase-3-')
        run: bun scripts/export-web-scanner-business.mjs ${{ runner.temp }}/phase1-verify-export
      - name: Verify install manifest and safe PWA artifacts
        if: startsWith(github.head_ref, 'pwa/phase-3-')
        run: node scripts/finalize-web-pwa-export.mjs ${{ runner.temp }}/phase1-verify-export
      - name: Exported client secret patterns
        run: node scripts/verify-client-secret-patterns.mjs ${{ runner.temp }}/phase1-verify-export
      - name: Diff check
        run: git diff --check

  preview:
    needs: verify
    # This exact Phase 3 branch hosts only after its isolated backend E2E job succeeds.
    if: github.head_ref != 'pwa/phase-3-scanner-commands-20261005' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'pwa/phase-1-') || startsWith(github.head_ref, 'pwa/phase-2-') || startsWith(github.head_ref, 'pwa/phase-3-'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install
        run: bun install --frozen-lockfile
      - name: Setup EAS for Preview hosting only
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Read Preview public environment (no Convex sync)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas env:pull preview --path .env.preview-pulled --non-interactive > eas-env-pull.log 2>&1
          node scripts/prepare-web-preview-env.mjs
      - name: Export actual Web Preview
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_WEB_ROLE_ROUTING: 'true'
          EXPO_PUBLIC_WEB_SCANNER_COMMANDS: 'false'
        run: bunx expo export --platform web --max-workers 2
      - name: Check Preview client secret patterns
        run: node scripts/verify-client-secret-patterns.mjs dist
      - name: Add isolated scanner lab for Phase 2 only
        if: startsWith(github.head_ref, 'pwa/phase-2-')
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_WEB_QR_LAB: 'true'
        run: |
          bun scripts/export-qr-lab.mjs dist
          node scripts/verify-client-secret-patterns.mjs dist
      - name: Add Phase 3 assets with commands disabled pending isolated backend deployment
        if: startsWith(github.head_ref, 'pwa/phase-3-')
        env:
          EXPO_PUBLIC_APP_ENV: preview
        run: bun scripts/export-web-scanner-business.mjs dist
      - name: Deploy Preview only after verify
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERIFIED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          eas deploy --environment preview --non-interactive --dev-domain stampaix-business --json > eas-deploy.json
          node scripts/report-web-preview-url.mjs
      - name: Remove temporary environment files
        if: always()
        run: rm -f .env.local .env.preview-pulled eas-env-pull.log

  isolated-preview-e2e:
    needs: verify
    if: needs.verify.result == 'success' && github.repository == 'PetFamily2/STAMPIX_APP' && github.head_ref == 'pwa/phase-3-scanner-commands-20261005' && github.event.pull_request.head.repo.full_name == github.repository && (github.actor == 'PetFamily2' || github.actor == 'github-actions[bot]')
    permissions:
      contents: read
      actions: read
    concurrency:
      group: phase3-stampaix-pwa-phase3-e2e
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout verified control revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reject superseded branch revision before reading credentials
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'pwa/phase-3-scanner-commands-20261005' });
            if (branch.commit.sha !== process.env.EXPECTED_HEAD) throw new Error('Superseded revision');
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Setup EAS for Preview environment only
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Pull Preview environment privately
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull preview --path .env.preview-pulled --non-interactive > "${{ runner.temp }}/eas-env-pull.log" 2>&1
      - name: Create verified isolated Preview, seed synthetic actors and run live E2E
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PHASE3_SOURCE_SHA: 072d2d30fa87cfdcad0d85088a5c1173d94d7acf
          PHASE3_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          VERIFIED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PHASE3_PREVIEW_NAME: stampaix-pwa-phase3-e2e
        run: bun scripts/phase3c1-preview-e2e.mjs
      - name: Checkout immutable approved application source
        uses: actions/checkout@v4
        with:
          ref: 072d2d30fa87cfdcad0d85088a5c1173d94d7acf
          path: phase3-source
      - name: Prepare immutable client checkout
        run: |
          cp .env.local phase3-source/.env.local
          ln -s "$GITHUB_WORKSPACE/node_modules" phase3-source/node_modules
      - name: Export exact corresponding Preview client
        working-directory: phase3-source
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx expo export --platform web --max-workers 2 > "${{ runner.temp }}/phase3-web-export.log" 2>&1
          bun scripts/export-web-scanner-business.mjs dist
          node scripts/finalize-web-pwa-export.mjs dist
          node scripts/verify-client-secret-patterns.mjs dist
          cd ..
          node scripts/phase3-preview/verify-export.mjs phase3-source/dist
      - name: Deploy EAS Hosting Preview only after live E2E
        working-directory: phase3-source
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERIFIED_HEAD_SHA: 072d2d30fa87cfdcad0d85088a5c1173d94d7acf
          EXPO_PUBLIC_APP_ENV: preview
        run: |
          node ../scripts/phase3-preview/deploy-hosting.mjs
          cd ..
          node scripts/phase3-preview/report-hosting.mjs
      - name: Install isolated browser QA tools
        run: bun scripts/phase3-preview/install-qa.mjs
      - name: Hosted authenticated RC QA
        run: bun scripts/phase3-preview/hosted-qa.mjs
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c1-preview-evidence
          path: |
            phase3c1-preview-evidence.json
            rc-hosted-evidence.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove private automation state
        if: always()
        run: rm -f "$RUNNER_TEMP/stampaix-rc-private.json"
